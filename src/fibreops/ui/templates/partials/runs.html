{% if not runs %}
  <p class="empty-state">[ AWAITING TELEMETRY · INJECT SIGNAL TO BEGIN ]</p>
{% endif %}

<ul class="space-y-2">
{% for run in runs %}
  <li>
    <button class="w-full text-left card sev-{{ run.severity }}"
            data-run-id="{{ run.run_id }}"
            aria-pressed="false"
            hx-get="/partials/run/{{ run.run_id }}"
            hx-target="#detail-panel"
            hx-swap="innerHTML">
      <div class="flex items-start gap-2">
        <span class="sev-dot sev-{{ run.severity }}"></span>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="badge sev-{{ run.severity }}">{{ run.severity }}</span>
            {% if run.dispatched %}<span class="badge badge-ok">dispatched</span>{% endif %}
            <span class="font-mono text-sm text-slate-200 truncate">{{ run.node_id or '?' }}</span>
            <time class="incident-elapsed" datetime="{{ run.started_at or '' }}"
                  title="{{ run.started_at or '' }}">{{ run.started_at[11:16] ~ ' UTC' if run.started_at else '' }}</time>
          </div>
          <div class="text-xs text-slate-400 mt-0.5 truncate">
            {{ run.signal_type or '?' }} · {{ run.region or '?' }} · {{ '{:,}'.format(run.customers_served) ~ ' customers' if run.customers_served is not none else 'Customer count unknown' }}
          </div>
          {% if run.summary %}
            <div class="card-summary" title="{{ run.summary }}">{{ run.summary }}</div>
          {% endif %}
          {% if run.engineer_name %}
            <div class="text-xs text-emerald-300 mt-1">→ {{ run.engineer_name }} · ETA {{ run.eta_minutes }} min</div>
          {% endif %}
        </div>
      </div>
    </button>
  </li>
{% endfor %}
</ul>
