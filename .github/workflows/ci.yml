name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-tooling:
    name: Evaluation SDK gates (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-evaluation.txt
      - run: python -m pip install -r requirements-evaluation.txt pytest pytest-asyncio
      - run: python -m pytest --noconftest tests/test_voice_sdk_evaluation.py tests/test_voice_audio_validation.py tests/test_voice_evaluation_comparison.py tests/test_voice_judge_live.py -q

  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Keep deployment settings out of Git
        shell: pwsh
        run: |
          $privatePaths = @(git ls-files | Where-Object {
            $_ -match '(^|/)\.azure/' -or
            ($_ -match '(^|/)\.env(\.|$)' -and $_ -ne '.env.example') -or
            $_ -match '^state/'
          })
          if ($privatePaths.Count -gt 0) {
            throw "Private deployment settings are tracked: $($privatePaths -join ', ')"
          }

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
          FIBREOPS_AGENT_BACKEND: local
        run: |
          python -m pytest -q --maxfail=1

      - name: Test voice playback and cancellation
        run: node --test tests/test_voice_client.cjs

      - name: Test isolated Voice Agents Preview publisher
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "voice-publisher-tests"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = if ($IsWindows) { Join-Path $venv "Scripts/python.exe" } else { Join-Path $venv "bin/python" }
          & $python -m pip install -r requirements-voice.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m unittest tests.test_voice_agent_publisher -v
          exit $LASTEXITCODE

      - name: Verify deployable wheel includes voice agent definition
        shell: pwsh
        run: |
          python -m pip wheel --no-deps --wheel-dir $env:RUNNER_TEMP .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import glob, os, zipfile; wheels = glob.glob(os.path.join(os.environ['RUNNER_TEMP'], 'fibreops-*.whl')); assert len(wheels) == 1; z = zipfile.ZipFile(wheels[0]); assert 'fibreops/voice_live/definition.json' in z.namelist()"
